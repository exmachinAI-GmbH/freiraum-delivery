version: "1.2"
status: FREIGABEKANDIDAT
source: arbeit/Entwürfe/K19_entwurf.md
rules:
  exactly_one_access_mark: true
  exactly_one_owner: true
  manual_screen_copies_forbidden: true
  accessibility: WCAG_2_2
  # 05.08.2026, Entscheidung E11 (gez. M. Veil, 4.8.): jede Aktion fuehrt die
  # sieben Angaben aus K19-M14. Die Lint-Regel prueft das; ein Serverbefehl mit
  # Platzhalter ist ein HINWEIS, kein Fehler -- der Namensraum ist bewusst
  # offen gelassen worden, statt ihn zu erfinden.
  every_action_complete_m14: true
# =====================================================================
# AKTIONSBLOCK nach K19-M14, ergaenzt am 5.8.2026 (Entscheidung E11)
#
# K19-M14 woertlich: "Jede Aktion MUSS in der Maschinenquelle Eingabe,
# Serverbefehl, Berechtigungspruefung, Lade-, Leer-, Erfolgs- und
# Fehlerzustand referenzieren. Ein UI-Zustand ersetzt keine serverseitige
# Autorisierung."
#
# GEZAEHLT AM 5.8.2026: 33 Bildschirme · 105 Aktionen · 89 verschiedene
# Serverbefehle · NULL Platzhalter. Der frueher hier stehende Satz
# ('32 · 100 · alle als Platzhalter') beschrieb den Stand vor der
# Benennung und vor EN-04a -- gefunden im Auftragsreview (Befund B07).
# Wer den Kopf liest statt die Liste, baut den falschen Umfang.
#
# DER NAMENSRAUM IST AM 5.8.2026 GEZEICHNET (BV-6 Nr. 67, gez. M. Veil).
# Er ist nicht erfunden, sondern ABGELEITET: K01-M27 und K01-M28 nennen
# bereits zwei Serverbefehle beim Namen -- create_app_after_fit und
# change_app_state. Beide sind gezeichnet; jede andere Konvention haette
# ihnen ab dem ersten Tag widersprochen.
#
# Daraus gilt: <taetigkeit>_<gegenstand>[_<naeheres>], Kleinschreibung mit
# Unterstrich, englisch, KEIN Praefix und KEIN Punkt. Der Gegenstand ist
# eine Sache, die es gibt -- Tabelle, Spalte, Begriff aus dem Konzept --
# nie die Beschriftung der Schaltflaeche.
#
# 105 Aktionen tragen 89 verschiedene Befehle: einige stehen an
# mehreren Bildschirmen, weil sie dieselbe serverseitige Wirkung ausloesen.
# Ein Name je Sache -- zwei Namen fuer dasselbe waeren der haeufigste
# Fehler dieser Arbeit gewesen.
#
# Jede Aktion ist von einem zweiten Lauf gegen die ASCII-Kaesten des
# K19-Entwurfs geprueft worden: fehlt eine Aktion, steht eine zuviel
# darin, ist eine Berechtigung in Wahrheit ein UI-Zustand, wurde ein
# Befehl erfunden. Nachgezaehlt: 0 erfundene Befehle, 0 Strukturfehler.
# =====================================================================
screens:
  - id: EN-01
    access: offen
    owner: K03
    aktionen:
      - kennung: anmelden
        eingabe: "E-Mail-Adresse (aus der Einladung vorbelegt) und sechsstelliger Code per E-Mail; actor.email ist zugleich der Anmeldename (K03-M03, K03-M05)"
        serverbefehl: "create_session_by_email_code"
        berechtigung: "serverseitig (K03-M13): Zeile in actor vorhanden, status AKTIV oder WARTET_2FA; GESPERRT wird abgewiesen (K03-D01). Welches Portal sich oeffnet, ergibt membership gegen portal_enabled (K20, K13)"
        zustand_laden: "Code wird geprueft, [Anmelden] inaktiv; die Meldung gibt nicht preis, ob ein Konto besteht (K03-M25)"
        zustand_leer: "Adresse oder Code fehlt — [Anmelden] ausgeblendet, Hinweis nennt das fehlende Feld (K19-M06)"
        zustand_erfolg: "Sitzung eroeffnet, last_login_at gesetzt; WARTET_2FA wird im selben Vorgang AKTIV (K03-M09); genau ein Portal oeffnet sich (K03-D02)"
        zustand_fehler: "falscher Code, unbekanntes Konto oder Einmal-Link aelter als 24 Stunden — dieselbe Meldung fuer alle drei Faelle, Verbleib auf EN-01, kein Teil-Zugang (K03-G01, K19 Abschn. 4.2); nach fuenf Fehlversuchen 15 Minuten gedrosselt (K03-M16)"

  - id: EN-02
    access: nach_anmeldung
    owner: K01
    aktionen:
      - kennung: neue_anwendung_erstellen
        eingabe: "keine — einer der vier gleichrangigen Vorschlaege, keiner ist vorausgewaehlt"
        serverbefehl: "open_direct_prototype_check"
        berechtigung: "serverseitig: gueltige Sitzung, actor.status = AKTIV, Mandant der Sitzung (K01-M13, K01-M15, K01-D07). Hier entsteht keine Zeile in app — die entsteht erst nach GEEIGNET (K01-M27)"
        zustand_laden: "Vorpruefung 1 laedt, Schaltflaeche inaktiv"
        zustand_leer: "entfaellt — Einstiegsaktion ohne eigenen Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "EN-03 geoeffnet, Vorpruefung 1 von 2; es entsteht weder eine Zeile in app (K01-M27) noch eine in fit_check — der Eignungs-Check beginnt erst auf EN-04"
        zustand_fehler: "Vorpruefung 1 nicht ladbar — Meldung, kein Vorgang, Verbleib auf EN-02 (fail-closed, K01-G01)"
      - kennung: erklaervideo_ansehen
        eingabe: "keine"
        serverbefehl: "open_explainer_video"
        berechtigung: "angemeldete Sitzung mit actor.status = AKTIV; kein Bestand der Anwendung wird beruehrt"
        zustand_laden: "Video wird geladen"
        zustand_leer: "entfaellt — Verweisaktion ohne Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "Video laeuft, der Gespraechsstand der Startseite bleibt erhalten"
        zustand_fehler: "Video nicht erreichbar — Hinweis an seiner Stelle, die uebrigen drei Vorschlaege bleiben bedienbar"
      - kennung: termin_vereinbaren
        eingabe: "keine"
        serverbefehl: "request_contact_appointment"
        berechtigung: "angemeldete Sitzung; die Ansprechperson stammt aus contact des eigenen Mandanten (Eigentuemer K11), nie aus einem fremden (K01-D08)"
        zustand_laden: "Weg zum Gespraech laedt"
        zustand_leer: "keine gueltige Ansprechperson hinterlegt (contact.is_valid) — statt der Schaltflaeche ein Hinweis mit dem Ersatzweg aus dem Nutzerhandbuch (K19-M06)"
        zustand_erfolg: "Gespraech mit der Ansprechperson angestossen"
        zustand_fehler: "Weg nicht erreichbar — Hinweis mit Ersatzweg, kein Vorgang angelegt"
      - kennung: etwas_eigenes_eintippen
        eingabe: "keine — oeffnet das Feld Nachricht; der Text wird erst mit [Senden] uebergeben"
        serverbefehl: "open_message_input"
        berechtigung: "angemeldete Sitzung mit actor.status = AKTIV (K01-M13)"
        zustand_laden: "entfaellt — die Aktion setzt nur den Schreibfokus"
        zustand_leer: "entfaellt — Einstiegsaktion ohne Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "das Feld Nachricht hat den Fokus, kein Vorgang entstanden"
        zustand_fehler: "Gespraechsspalte nicht bedienbar — Hinweis; die drei uebrigen Vorschlaege bleiben erreichbar"
      - kennung: nachricht_senden
        eingabe: "Freitext im Feld Nachricht; der Text ist Daten, eine darin enthaltene Anweisung wird nicht ausgefuehrt (K01-M16)"
        serverbefehl: "send_chat_message"
        berechtigung: "serverseitig: Sitzung und Mandant der Sitzung (K01-M15); vor der Uebergabe an ein Sprachmodell wird maskiert (K01-M17), und der Modellpfad braucht einen vollstaendigen Eintrag (K01-M31)"
        zustand_laden: "Antwort wird erzeugt, [Senden] inaktiv"
        zustand_leer: "leeres Feld — [Senden] ausgeblendet, Hinweis nennt die fehlende Eingabe (K19-M06)"
        zustand_erfolg: "Beitrag steht im Gespraech; Herkunft und Bearbeitungszustand sind getrennt ausgewiesen (K19-G03, K19-G09)"
        zustand_fehler: "Maskierung oder Modellpfad nicht verfuegbar — Abbruch ohne Antwort, der Text bleibt im Feld stehen (fail-closed, K01-G14)"
      - kennung: fortfuehren
        eingabe: "Karte einer eigenen Anwendung (app.id) mit laufendem Gespraech, app.sealed_at leer"
        serverbefehl: "resume_app"
        berechtigung: "serverseitig: app.tenant_id = Mandant der Sitzung; eine Anwendung eines fremden Mandanten gilt als nicht vorhanden (K01-M15, K01-D08)"
        zustand_laden: "Karten aus app geladen; der Zustandsname stammt aus lifecycle_state_label je ui_locale (K01-M11, Traeger K11)"
        zustand_leer: "keine Anwendung vorhanden — an Stelle der Karten ein Hinweis; Sortierung und Wortlaut sind offen (O-K01-19)"
        zustand_erfolg: "genau die gespeicherte Stelle derselben Stufe, kein Neubeginn der Stufe (K01-M10)"
        zustand_fehler: "Stand nicht lesbar — Meldung, die Karte bleibt stehen, kein Sprung an den Anfang der Stufe"
      - kennung: ansehen
        eingabe: "Karte einer eigenen Anwendung mit gesetztem app.sealed_at"
        serverbefehl: "open_app_readonly"
        berechtigung: "wie fortfuehren; zusaetzlich serverseitig nur lesend — zurueckliegende Stufen sind nicht bedienbar (K01-D12, K19-G07)"
        zustand_laden: "Anwendung wird geladen"
        zustand_leer: "entfaellt — die Aktion erscheint nur an einer Karte mit gesetztem Siegel; nie zugleich mit [Fortfuehren] (Begruendung nach K19-M06)"
        zustand_erfolg: "Anwendung in Nur-Ansicht; das Anzeigelabel Angebot angefragt ist aus app.sealed_at abgeleitet (K01-G02, K19-G04)"
        zustand_fehler: "Anwendung nicht lesbar — Meldung, die Karte bleibt stehen, kein Ersatzweg (fail-closed, K01-M25)"

  - id: EN-03
    access: nach_anmeldung
    owner: K04
    aktionen:
      - kennung: check_starten
        eingabe: "keine — die erste der fuenf Fragen wird geoeffnet (K04-M02, K04-M22)"
        serverbefehl: "start_direct_prototype_check"
        berechtigung: "serverseitig: gueltige Sitzung, actor.status = AKTIV (K03-D01, K01-D07), Mandantenschnitt der Sitzung (K01-M15, K02). Kein Bezug auf fit_check — fit_question, fit_option und fit_check tragen allein den Eignungs-Check (EN-04); der Direkt-Prototyp-Check hat keinen Traeger im Datenmodell (O-K04-10)"
        zustand_laden: "Frage 1 wird geladen, beide Schaltflaechen inaktiv bis geladen"
        zustand_leer: "entfaellt — Einstiegsaktion ohne eigenen Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "EN-03a geoeffnet, Frage 1 von 5"
        zustand_fehler: "Fragenfluss nicht ladbar — Meldung, Verbleib auf EN-03; [Ueberspringen] bleibt offen, es entsteht kein Vorschlag"
      - kennung: ueberspringen
        eingabe: "keine"
        serverbefehl: "start_fit_check"
        berechtigung: "serverseitig: ueberspringbar ist allein der Direkt-Prototyp-Check; der Eignungs-Check folgt zwingend (K04-M02, K04-D01)"
        zustand_laden: "Vorpruefung 2 laedt"
        zustand_leer: "entfaellt — Verweisaktion ohne Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "EN-04 geoeffnet; es entsteht kein Vorschlag und kein Arbeitsdokument"
        zustand_fehler: "Wechsel fehlgeschlagen — Meldung, Verbleib auf EN-03, kein Vorgang angelegt (fail-closed, K04-G04)"

  - id: EN-03a
    access: nach_anmeldung
    owner: K04
    aktionen:
      - kennung: frage_beantworten
        eingabe: "je Frage genau eine der drei Antwortmoeglichkeiten, fuenf Fragen nacheinander; Wortlaut und Zuordnung aus K04 Abschn. 5.0 (K04-M22)"
        serverbefehl: "answer_direct_prototype_check_question"
        berechtigung: "serverseitig: actor.status = AKTIV (K03-D01, K01-D07), Mandantenschnitt der Sitzung (K01-M15, K02). Die Auswertung — Vetorecht der Fragen 5 und 1, Zaehlung der Fragen 2 bis 4 — laeuft auf dem Server; der Bildschirm liefert kein Ergebnis mit (K04-M23, K04-M24). Welche Tabelle Fragen und Antworten traegt, ist offen (O-K04-10)"
        zustand_laden: "naechste Frage wird geladen; beide Weiterwege inaktiv, bis das Ergebnis vorliegt"
        zustand_leer: "Frage ohne Antwort — der Weiterweg ist ausgeblendet, der Hinweis nennt die offene Frage (K19-M06)"
        zustand_erfolg: "Antwort uebernommen; naechste Frage oder Ergebnis mit genau einem Begruendungssatz, der die ausschlaggebende Antwort nennt (K04-M25)"
        zustand_fehler: "Antwort fehlt oder die Auswertung scheitert — der Vorschlag lautet Anwendung, und der Grund wird genannt (K04-D11, fail-closed). Abbruch des Flusses fuehrt ohne Vorschlag nach EN-03 zurueck"
      - kennung: arbeitsdokument
        eingabe: "keine — Weiterweg nach dem Vorschlag; er ist auch gegen den Vorschlag waehlbar (K04-M03)"
        serverbefehl: "create_direct_prototype"
        berechtigung: "serverseitig: das Arbeitsdokument entsteht in direct_prototype (Eigentuemer K07), nie in app; CHECK app_is_verified schliesst das aus (K01-M04, K04-D07)"
        zustand_laden: "Uebergabe an den Weg Arbeitsdokument laeuft"
        zustand_leer: "entfaellt — Weiterweg ohne eigenen Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "EN-12; der Direkt-Prototyp bleibt ungeprueft und ist nie Gegenstand einer Angebotsanfrage (K04-G05)"
        zustand_fehler: "Uebergabe gescheitert — Verbleib in Vorpruefung 1, kein Dokument angelegt (fail-closed, K04 Abschn. 6)"
      - kennung: vorpruefung_2
        eingabe: "keine"
        serverbefehl: "start_fit_check"
        berechtigung: "serverseitig: actor.status = AKTIV, Mandantenschnitt der Sitzung; der Eignungs-Check ist nicht ueberspringbar (K04-D01)"
        zustand_laden: "EN-04 laedt"
        zustand_leer: "entfaellt — Weiterweg ohne eigenen Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "EN-04 geoeffnet; der Vorschlag aus Vorpruefung 1 entscheidet nichts (K04-M03)"
        zustand_fehler: "Wechsel fehlgeschlagen — Meldung, Vorschlag und Antworten bleiben erhalten"

  - id: EN-04
    access: nach_anmeldung
    owner: K04
    aktionen:
      - kennung: antwort_waehlen
        eingabe: "genau eine fit_option je fit_question (fit_answer_aktiv_uq, Eigentuemer K04)"
        serverbefehl: "create_fit_answer"
        berechtigung: "serverseitig: Sitzung des angemeldeten Nutzers; fit_check.tenant_id ist Pflicht und muss der Mandant der Sitzung sein (K04-M10, K04-D08, K02)"
        zustand_laden: "Fragen aus fit_question/fit_option geladen; Schaltflaechen inaktiv bis geladen"
        zustand_leer: "keine Antwort gewaehlt — [Weiter] ausgeblendet, Hinweis nennt die fehlende Frage (K19-M06)"
        zustand_erfolg: "Antwort gespeichert, naechste Frage oder Ergebnis"
        zustand_fehler: "Speichern fehlgeschlagen — Meldung, Antwort bleibt waehlbar, kein Datenverlust"
      - kennung: antwort_aendern
        eingabe: "vorhandene fit_answer wird zurueckgenommen (superseded_at), neue Wahl"
        serverbefehl: "supersede_fit_answer"
        berechtigung: "wie antwort_waehlen; Zuruecknahme nur am eigenen fit_check. Auch nach einem Halt zulaessig — Antwort aendern ist einer der drei Auswege (K04-M08), obwohl completed_at gesetzt ist. Eine zweite offene Antwort auf dieselbe Frage weist fit_answer_aktiv_uq ab (K04-M14, K04-M15)"
        zustand_laden: "bisherige Wahl markiert"
        zustand_leer: "entfaellt — Aktion existiert nur bei vorhandener Antwort (Begruendung: K19-M06)"
        zustand_erfolg: "alte Antwort traegt superseded_at, neue ist aktiv; outcome wird neu berechnet (K04 Abschn. 4.4)"
        zustand_fehler: "Zuruecknahme fehlgeschlagen — alte Antwort bleibt unveraendert gueltig; entfernt wird keine Zeile (K04-D03)"
      - kennung: weiter
        eingabe: "alle drei Fragen beantwortet (fit_answer je question_code, nicht zurueckgenommen)"
        serverbefehl: "evaluate_fit_check"
        berechtigung: "serverseitig: outcome wird aus is_eligible der gewaehlten Optionen berechnet, nie vom Client uebergeben (K04-M13, fail-closed)"
        zustand_laden: "Pruefung laeuft, [Weiter] inaktiv"
        zustand_leer: "unbeantwortete Frage — [Weiter] ausgeblendet, Hinweis (K19-M06)"
        zustand_erfolg: "GEEIGNET -> EN-04a (Zweckbestimmung); jedes Ergebnis ausser OFFEN traegt completed_at (fit_done_needs_ts, K04-M12)"
        zustand_fehler: "NICHT_GEEIGNET -> Halt-Feld an Stelle des Weiterwegs, begruendet mit der aufhaltenden Antwort und mit den drei Auswegen (K04-M08, K04-M09); kein Gespraech, keine Anwendung (K04-D04). Scheitert die Pruefung selbst, bleiben die Antworten erhalten und der Versuch ist wiederholbar"
      - kennung: termin
        eingabe: "keine"
        serverbefehl: "request_contact_appointment"
        berechtigung: "angemeldeter Nutzer; die Ansprechperson stammt aus contact des eigenen Mandanten (Eigentuemer K11)"
        zustand_laden: "Weg zum Gespraech laedt"
        zustand_leer: "entfaellt — Verweisaktion ohne Datenbestand (Begruendung nach K19-M06)"
        zustand_erfolg: "Gespraech mit der Ansprechperson angestossen (K04-M08)"
        zustand_fehler: "Weg nicht erreichbar — Hinweis mit Ersatzweg aus dem Nutzerhandbuch"
      - kennung: zur_uebersicht
        eingabe: "keine"
        serverbefehl: "open_app_list"
        berechtigung: "angemeldeter Nutzer"
        zustand_laden: "Uebersicht laedt"
        zustand_leer: "entfaellt — Verweisaktion (Begruendung nach K19-M06)"
        zustand_erfolg: "Uebersicht angezeigt; das Ergebnis des Checks bleibt bestehen und wird nicht getilgt (K04-D03)"
        zustand_fehler: "Rueckkehr fehlgeschlagen — Meldung, der Check bleibt geoeffnet"

  # EN-04a · Zweckbestimmung. Neu am 05.08.2026, Zeichnung T3.
  # EN-04 verwies im Erfolgsfall seit jeher auf diesen Bildschirm; es gab ihn
  # nicht. Damit rief keine der katalogisierten Aktionen create_app_after_fit
  # auf -- den einzigen Weg zu einer Anwendungszeile (K01-M27). Der Inhalt
  # stammt aus K04-M19 bis M21, nicht aus einem Entwurf.
  - id: EN-04a
    access: nach_anmeldung
    owner: K04
    aktionen:
      - kennung: zweckfrage_beantworten
        eingabe: "zwei getrennte Ja/Nein-Antworten: Bewertung von Menschen (Anhang III) und verbotene Praktik (Art. 5)"
        serverbefehl: "create_purpose_declaration"
        berechtigung: "serverseitig: Sitzung des angemeldeten Nutzers; nur zum eigenen fit_check mit outcome = GEEIGNET; der Schritt ist kein fit_question und beruehrt die drei Dimensionen der Eignung nicht (K04-M19)"
        zustand_laden: "beide Fragen geladen, [Weiter] inaktiv bis beide beantwortet sind"
        zustand_leer: "eine der beiden Fragen unbeantwortet — [Weiter] ausgeblendet, Hinweis nennt die fehlende Frage (K19-M06)"
        zustand_erfolg: "Erklaerung gespeichert. Auswertung in dieser Reihenfolge, der zweiten Frage kommt der Vorrang zu (K04-M20: bei Treffer in Frage 2 tritt die Ablehnung an die Stelle der Kenntnisnahme): Treffer in Frage 2 -> Halt-Feld, auch wenn Frage 1 ebenfalls zutrifft; sonst Treffer in Frage 1 -> Kenntnisnahme; sonst kein Treffer -> anwendung_anlegen, danach EN-05"
        zustand_fehler: "Speichern fehlgeschlagen — keine Anwendung, keine Stufe 01; die Antworten bleiben erhalten und der Versuch ist wiederholbar (fail-closed)"
      - kennung: kenntnis_nehmen
        eingabe: "Bestaetigung zur Warnung: Anhang III kann greifen, der Kunde bringt die Anwendung als Anbieter unter eigenem Namen in Verkehr und traegt die Pflichten aus Art. 9, 11, 14, 17 und 43"
        serverbefehl: "create_purpose_acknowledgement"
        berechtigung: "nur nach Treffer in Frage 1; die Kenntnisnahme bleibt als Nachweis erhalten und geht in das Uebergabe-Paket ein (K04-M21, Eigentuemer K10)"
        zustand_laden: "Warnung und Pflichtenhinweis geladen, [Kenntnis genommen] inaktiv bis gelesen"
        zustand_leer: "entfaellt — die Aktion erscheint nur bei Treffer in Frage 1 (Begruendung nach K19-M06)"
        zustand_erfolg: "Nachweis geschrieben -> anwendung_anlegen, danach EN-05. Der Nachweis allein oeffnet keine Anwendung; die Zeile entsteht ausschliesslich ueber create_app_after_fit (K01-M27)"
        zustand_fehler: "Nachweis nicht schreibbar — kein Weiterweg, keine Anwendung. Ohne Nachweis ist die Auskunftspflicht nach Art. 25 Abs. 4 nicht belegbar (K04-M21, fail-closed)"
      - kennung: anwendung_anlegen
        eingabe: "abgeschlossener fit_check mit outcome = GEEIGNET, vorliegender Zweckbestimmung und -- bei Treffer in Frage 1 -- vorliegender Kenntnisnahme"
        serverbefehl: "create_app_after_fit"
        berechtigung: "ausschliesslich serverseitig; er prueft in derselben Transaktion Eignung GEEIGNET, aktives Konto, Mandantenzugehoerigkeit, legal_space = DE und currency = EUR (K01-M27, Eigentuemer K01). Bei Treffer in Frage 1 der Zweckbestimmung ist die Kenntnisnahme zusaetzliche Vorbedingung (K04-M21) -- ohne sie ist die Auskunftspflicht nach Art. 25 Abs. 4 nicht belegbar. Ein nullbarer Fremdschluessel im Schema ist keine Erlaubnis, ihn zu umgehen"
        zustand_laden: "Anlage laeuft, alle Schaltflaechen inaktiv"
        zustand_leer: "entfaellt — die Aktion setzt einen bestandenen Eignungs-Check voraus (Begruendung nach K19-M06)"
        zustand_erfolg: "Anwendungszeile angelegt, fit_check.app_id gesetzt, Verlaufszeile DISCOVERY erzeugt -> EN-05"
        zustand_fehler: "eine der fuenf Pruefungen scheitert — abgewiesen, keine Zeile, Grund benannt; der Eignungsriegel weist auch den Umweg ab (K01-M27, fail-closed)"
      - kennung: antwort_aendern
        eingabe: "Rueckweg zu EN-04, bestehende Antwort wird zurueckgenommen"
        serverbefehl: "supersede_fit_answer"
        berechtigung: "wie in EN-04; einer der drei Auswege nach einem Halt (K04-M08)"
        zustand_laden: "bisherige Wahl markiert"
