# =====================================================================
# FREIRAUM Coding-Harness · Tor 1 — mechanisch
#
# ACHTUNG: "Tor 1" ist eine Messstufe DIESES HARNESS. Es ist NICHT Tor I
# des Bauauftrags (Auftragsreife, geschlossen am 06.08.2026).
#
# Tor 1 misst, ob der Stand zur Quelle passt. Es ist ein TEIL-Orakel:
# "Kompilierbarer Code kann fachlich falsch sein" (Blatt 26:51). Tor 2
# (blinde Prueffaelle), Tor 3 (Fremdmodell) und Tor 4 (Mensch) laufen
# ausserhalb dieser Datei.
#
# Kein Deployment. Keine Geheimnisse. Keine Zielumgebung.
# Ein Lauf, der nicht messen kann, meldet GESPERRT — nie gruen (K23-M22).
# =====================================================================
name: Tor 1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tor1-${{ github.ref }}
  cancel-in-progress: false

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: pruefstand
  PGDATABASE: freiraum_ci

jobs:

  # -------------------------------------------------------------------
  lint:
    name: Tor 1a · Lint und Geheimnisschranke
    runs-on: ubuntu-latest
    steps:
      # GANZE HISTORIE, nicht flach. F42 prueft, ob der im Tor-3-Nachweis
      # genannte Commit ein VORFAHR des Abnahmestandes ist. Mit einem
      # flachen Klon faende `git merge-base --is-ancestor` ihn nicht und
      # meldete einen tragenden Nachweis als nicht tragend -- ein Riegel,
      # der aus dem falschen Grund rot wird, ist schlimmer als keiner.
      # tor3.yml fuehrt dieselbe Zeile aus demselben Grund.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geheimnisschranke (K23-D09)
        run: |
          set -euo pipefail
          if git ls-files | grep -nE '(^|/)\.env|\.pem$|\.key$|(^|/)secrets/'; then
            echo "::error::Geheimnisverdacht im Versionsstand"; exit 1
          fi
          if git grep -nIE '(BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-|sk-[A-Za-z0-9]{20,})' \
               -- . ':!.github/workflows/tore.yml'; then
            echo "::error::Schluesselmuster im Versionsstand"; exit 1
          fi

      # -----------------------------------------------------------------
      # SHELLCHECK KOMMT ALS FESTGESCHRIEBENE FASSUNG, NICHT AUS apt-get.
      #
      # BEFUND vom 19.08.2026: Tor 1a blieb bei diesem Schritt stehen, waehrend
      # Tor 1b und 1c laengst gruen waren. Gemessen an Lauf #151: `checkout`
      # 1s, `Geheimnisschranke` 0s -- und dann Stillstand im Shell-Lint. Die
      # erste Zeile war `apt-get update && apt-get install shellcheck`, also
      # ein Paketdownload von einem fremden Spiegelserver bei JEDEM Lauf.
      #
      # Ein Tor, das an einem fremden Spiegelserver haengt, misst nicht den
      # Bau -- es misst das Wetter im Netz. Derselbe Gedanke steht schon beim
      # Python-Lint: "ein Lauf, dessen Pruefwerkzeug sich unter der Hand
      # aendert, misst zwei Staende gegeneinander".
      #
      # Jetzt: eine benannte Fassung, gegen ihre Pruefsumme geprueft. Weicht
      # sie ab, wird NICHT gelintet, sondern abgebrochen -- ein Werkzeug
      # unbekannter Herkunft prueft nichts, es behauptet nur.
      # -----------------------------------------------------------------
      - name: Shell-Lint
        env:
          SHELLCHECK_FASSUNG: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          set -euo pipefail
          archiv="shellcheck-${SHELLCHECK_FASSUNG}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$archiv" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_FASSUNG}/${archiv}"
          echo "${SHELLCHECK_SHA256}  ${archiv}" | sha256sum -c - || {
            echo "::error::shellcheck ${SHELLCHECK_FASSUNG} weicht von seiner Pruefsumme ab — Tor 1a GESPERRT (K23-M22). Es wird nicht mit einem Werkzeug unbekannter Herkunft gelintet."
            exit 1; }
          tar -xJf "$archiv" "shellcheck-${SHELLCHECK_FASSUNG}/shellcheck"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_FASSUNG}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "$archiv" "shellcheck-${SHELLCHECK_FASSUNG}"
          shellcheck --version

          mapfile -t skripte < <(git ls-files '*.sh')
          if [ "${#skripte[@]}" -eq 0 ]; then
            echo "::error::keine Shell-Skripte gefunden — Tor 1a GESPERRT"; exit 1
          fi
          for s in "${skripte[@]}"; do bash -n "$s"; done
          shellcheck -S warning "${skripte[@]}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-Lint
        run: |
          set -euo pipefail
          # app/ seit 10.08.2026 (Scheibe 1 · Anmeldung). Ohne den Zusatz
          # laeuft Tor 1a gruen an dem Verzeichnis vorbei, in dem der
          # Serverpfad steht -- ein gruener Lauf, der nichts misst.
          python3 -m compileall -q werkzeuge mail app
          # Festgeschriebene Fassung statt "neuestes ruff": ein Lauf, dessen
          # Pruefwerkzeug sich unter der Hand aendert, misst zwei Staende
          # gegeneinander (K23-M18 Glied 5, Glied 7).
          pip install --quiet -r requirements.txt
          ruff check werkzeuge mail app

      # Der Bildschirmvertrag ist Grundwahrheit wie die DDL, nur fuer die
      # Oberflaeche. Bis zum 14.08.2026 lag er allein in der Konzept-Fabrik:
      # vier Vorlagen unter app/vorlagen/ beriefen sich auf K19-M01, ohne
      # eine Fassung zu nennen, und kein Lauf hat je eine K19-Klausel
      # gemessen. Geprueft wird gegen die MITGEFUEHRTE Kopie -- ein Lauf,
      # der auf die Dropbox zugreifen muesste, ist nicht reproduzierbar.
      - name: UI-Vertrag — K19-M03 und K19-M14 (schema/K19_screens.yaml)
        run: |
          set -euo pipefail
          if [ ! -f schema/K19_screens.yaml ]; then
            echo "::error::schema/K19_screens.yaml fehlt — Tor 1a GESPERRT (K23-M22)."
            echo "Ohne Bildschirmvertrag misst dieser Lauf die Oberflaeche nicht."
            exit 1
          fi
          # Die Kopie gegen ihre hinterlegte Summe. Aenderungsregel "keine":
          # weicht sie ab, ist die KOPIE ungueltig -- nicht das Original.
          ( cd schema && shasum -a 256 -c K19_screens.sha256 ) \
            || { echo "::error::schema/K19_screens.yaml weicht von der hinterlegten Pruefsumme ab"; exit 1; }
          # HINWEIS blockiert nicht, FEHLER schon (Exit 1).
          python3 werkzeuge/k19_screens_lint.py schema/K19_screens.yaml

      # -----------------------------------------------------------------
      # Die KAESTEN. Bis zum 18.08.2026 lag im Repo allein die
      # Maschinenquelle -- sie fuehrt je Bildschirm Zugangsmarke,
      # Eigentuemer und Aktionen, aber keinen Kasten. Deshalb konnte kein
      # Lauf je pruefen, ob eine Vorlage der gezeichneten Anordnung folgt,
      # und deshalb ist die Luecke ein Vierteljahr lang niemandem
      # aufgefallen (Blatt 94, BEF-UI-1, Punkt 3).
      #
      # Aenderungsregel "keine", wie bei K19_screens.yaml: weicht die Kopie
      # von ihrer Summe ab, ist die KOPIE ungueltig -- nicht das Original.
      # Das Original liegt in der Konzeptfabrik und wird hier nie gelesen.
      # -----------------------------------------------------------------
      - name: UI-Vertrag — die Kaesten (schema/K19_build_referenz.md)
        run: |
          set -euo pipefail
          if [ ! -f schema/K19_build_referenz.md ]; then
            echo "::error::schema/K19_build_referenz.md fehlt — Tor 1a GESPERRT (K23-M22)."
            echo "Ohne die Kaesten misst dieser Lauf die Anordnung der Bildschirme nicht."
            exit 1
          fi
          ( cd schema && shasum -a 256 -c K19_build_referenz.sha256 ) \
            || { echo "::error::schema/K19_build_referenz.md weicht von der hinterlegten Pruefsumme ab"; exit 1; }

      # -----------------------------------------------------------------
      # DER UI-RIEGEL (Blatt 94, Punkt 4 -- gezeichnet 18.08.2026).
      #
      # Er macht aus der Weisung vom 11.08.2026 (Blatt 70, "kein Bildschirm
      # ohne seinen K19-Kasten") eine Bedingung, an der dieser Lauf
      # scheitert. CLAUDE.md nennt K19 seit jeher als verbindliche
      # UI-Referenz; der Text hat nicht getragen -- am 18.08.2026 trug 1 von
      # 8 Vorlagen ihren Kasten.
      #
      # Ein GESPERRT sperrt den Lauf NICHT (K23-M22, Blatt 64): heute trifft
      # es EN-04a, fuer den die Referenz keinen Kasten fuehrt. Ein Lauf ohne
      # eine einzige bestandene Vorlage gilt dagegen als Fehlschlag -- sonst
      # liefe ein Riegel gruen durch, der nichts gemessen hat.
      # -----------------------------------------------------------------
      - name: UI-Riegel — jede Vorlage traegt ihren Kasten (Blatt 70)
        run: python3 werkzeuge/k19_kasten_pruefung.py

      # -----------------------------------------------------------------
      # F42 -- keine Scheibenabnahme ohne gezeichneten Tor-3-Nachweis.
      #
      # C-4 ist seit Blatt 26:30 gezeichnet ("einmal je Scheibenabnahme,
      # nicht je Aenderung") und wurde bis zum 18.08.2026 von keinem Lauf
      # erzwungen -- dieselbe Beobachtung wie bei F41.
      #
      # ER LAEUFT HIER, NICHT NUR IN tor3.yml: tor3.yml haengt an
      # workflow_dispatch oder an einer Marke am Antrag. Beides setzt
      # voraus, dass jemand daran denkt. Eine Schranke, an die man denken
      # muss, ist keine.
      #
      # Ohne angemeldete Abnahme meldet der Lauf "nichts zu pruefen" und
      # geht weiter -- F42 bremst den Alltag nicht, sondern die Abnahme.
      # -----------------------------------------------------------------
      - name: F42 — keine Scheibenabnahme ohne fremden Blick (C-4)
        run: python3 werkzeuge/tor3_pflicht.py

      - name: Klauselregister — erzeugen oder nachweisen (K23-M01, K23-M02)
        run: |
          set -euo pipefail
          REG=nachweise/klauselregister/register.json
          if [ -n "${FREIRAUM_KONZEPTE:-}" ] && [ -d "${FREIRAUM_KONZEPTE}" ]; then
            python3 werkzeuge/klauselregister.py \
              --konzepte "$FREIRAUM_KONZEPTE" \
              --pflege nachweise/klauselregister/pflege.json \
              --ziel "$REG" --markdown nachweise/klauselregister/register.md
          elif [ -f "$REG" ]; then
            echo "Konzeptordner nicht im Lauf — der mitgefuehrte Stand wird geprueft."
            python3 - "$REG" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          z = r["zaehlung"]
          print(z["klauseln"], "Klauseln · ohne Akzeptanzkriterium",
                z["ohne_akzeptanzkriterium"], "· ohne Test", z["ohne_test"])
          for b in r["befunde"]:
              print("BEFUND", b)
          sys.exit(1 if r["befunde"] else 0)
          PY
          else
            echo "::error::Kein Klauselregister — Tor 1a GESPERRT (K23-M01, K23-M22)."
            exit 1
          fi

      # Herkunftsgraph nach K23-M03 · Bedingung 4 des Tor II.
      #
      # Dieser Schritt SPERRT NICHT. Der Graph ist ein Nachweis, keine
      # Abnahmebedingung; eine fehlende Kante ist ein Projektbefund. Die Anlage
      # Baustrategie sagt dazu: eine Verletzung von Steuerungsregeln ist
      # "ein Projektbefund, niemals eine zusaetzliche Abnahmebedingung".
      #
      # Was er erzwingt, ist allein die FUEHRUNG des Nachweises: weicht der
      # mitgefuehrte Stand vom neu gerechneten ab, ist die abgelegte Sicht
      # veraltet -- und das wird gemeldet, nicht verschwiegen.
      - name: Herkunftsgraph — fuehren und auf Aktualitaet pruefen (K23-M03)
        run: |
          set -euo pipefail
          python3 werkzeuge/herkunft.py
          if ! git diff --quiet -- nachweise/herkunft/; then
            echo "::warning::Der abgelegte Herkunftsgraph ist nicht der gerechnete."
            echo "   Naechster Schritt: python3 werkzeuge/herkunft.py ausfuehren"
            echo "   und nachweise/herkunft/ mit einchecken."
            git --no-pager diff --stat -- nachweise/herkunft/
          fi

      # Fundstellenprobe der Steuerungstexte.
      #
      # Bis zum 16.08.2026 hat kein Tor je eine Behauptung ueber ein DOKUMENT
      # nachgeschlagen. Klauselregister und Herkunftsgraph rechnen den Code
      # nach; wenn CLAUDE.md aber schreibt, in `README.md`:30 stehe "Keine
      # Geheimnisse im Repo", hat das niemand aufgeschlagen. Der README ist am
      # 14.08.2026 von 84 auf 265 Zeilen umgeschrieben worden. Die Fundstelle
      # zeigte seither ins Leere, und zwoelf gruene Laeufe haben es nicht
      # gemerkt.
      #
      # DIESER SCHRITT SPERRT -- anders als der Herkunftsgraph darueber, der
      # nur `::warning::` meldet. Genau deshalb: der abgelegte Herkunftsgraph
      # auf der Hauptspur ist nachweislich veraltet, obwohl jeder Lauf es
      # anzeigt. Eine Warnung bewirkt in diesem Projekt nichts. Das ist der
      # Beleg im eigenen Haus.
      #
      # Gesperrt wird nur an den ANWEISENDEN Texten (CLAUDE.md, .claude/,
      # README, CONTRIBUTING, AGENTS, install.sh, aufbau.sh, ruff.toml). Wer
      # sie liest, handelt danach. Nachweise und Arbeitsstaende sind datiert:
      # ihre Verweise werden gemeldet, sperren aber nicht -- sonst zwaenge
      # dieser Schritt dazu, Nachweise nachtraeglich umzuschreiben.
      #
      # FREIRAUM_KONZEPTE liegt im Lauf nicht vor. Fundstellen in den
      # Konzepten melden deshalb GESPERRT, nicht bestanden (K23-M22).
      - name: Fundstellen der Steuerungstexte nachschlagen (K23-M22)
        run: |
          set -euo pipefail
          python3 werkzeuge/fundstellen.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: klauselregister
          path: nachweise/klauselregister/
          if-no-files-found: warn

  # -------------------------------------------------------------------
  migration:
    name: Tor 1b · Migration gegen frische Datenbank
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruefstand
          POSTGRES_DB: freiraum_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Basisschema vorhanden?
        run: |
          set -euo pipefail
          if [ ! -f schema/freiraum_datamodel.sql ]; then
            echo "::error::schema/freiraum_datamodel.sql fehlt — Tor 1b GESPERRT."
            echo "Ohne Grundwahrheit misst dieser Lauf nichts (Rangfolge Rang 1)."
            exit 1
          fi

      - name: Schema und Migrationen einspielen
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -q -f schema/freiraum_datamodel.sql
          for m in migrations/*.sql; do
            [ -e "$m" ] || { echo "::error::keine Migration gefunden"; exit 1; }
            echo "== $m"
            psql -v ON_ERROR_STOP=1 -q -f "$m"
          done
          pg_dump --schema-only --no-owner > /tmp/schema_1.sql
          pg_dump --data-only  --no-owner --column-inserts > /tmp/daten_1.sql

      - name: Zweiter Lauf aendert Schema UND Daten nicht
        # Bauauftrag §9 Tor I Nr. 4 (:647) und Meilenstein M1 (:215) verlangen
        # BEIDE Vergleiche. Ein reiner Schemavergleich misst zu wenig.
        #
        # VERGLICHEN WIRD DER INHALT, NICHT DIE DARSTELLUNG. Zwei Quellen von
        # Rauschen wuerden das Gate sonst dauerhaft falsch rot melden -- gemessen
        # am 07.08.2026 mit M30 gegen PostgreSQL 16.14:
        #
        #   1. pg_dump schreibt je Lauf ein zufaelliges \restrict/\unrestrict.
        #      Es beschreibt nichts an der Datenbank.
        #   2. M30 schreibt retention_rule fuer PROJEKT_VORVERTRAG mit
        #      "ON CONFLICT (class) DO UPDATE" bei jedem Lauf neu (M30:134-141).
        #      Der INHALT bleibt gleich, die Zeile wandert physisch. Ein
        #      --data-only-Abzug gibt Heap-Reihenfolge wieder, keine Ordnung.
        #
        # Deshalb: Rauschzeilen entfernen, Daten vor dem Vergleich sortieren.
        # Das senkt keinen Pruefwert (K23-D05) -- ein Zufallswert misst nichts.
        # M30 selbst wird NICHT angefasst: ihre Pruefsumme stimmt mit dem
        # gezeichneten N2-Abnahmenachweis vom 06.08.2026 ueberein.
        run: |
          set -euo pipefail
          entrausche() { grep -vE '^\\(un)?restrict ' "$1"; }
          for m in migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$m"
          done
          pg_dump --schema-only --no-owner > /tmp/schema_2.sql
          pg_dump --data-only  --no-owner --column-inserts > /tmp/daten_2.sql
          entrausche /tmp/schema_1.sql       > /tmp/s1.txt
          entrausche /tmp/schema_2.sql       > /tmp/s2.txt
          entrausche /tmp/daten_1.sql | sort > /tmp/d1.txt
          entrausche /tmp/daten_2.sql | sort > /tmp/d2.txt
          diff -u /tmp/s1.txt /tmp/s2.txt \
            || { echo "::error::Zweiter Lauf veraendert das Schema"; exit 1; }
          diff -u /tmp/d1.txt /tmp/d2.txt \
            || { echo "::error::Zweiter Lauf veraendert die Daten"; exit 1; }
          echo "Zweiter Lauf: Schema und Daten inhaltsgleich."

      - name: Negativfaelle — jeder scheitert an SEINER Bedingung
        # Bauauftrag §9 Tor I Nr. 6 (:649) · README.md:34 · offener Punkt O-K23-7
        run: |
          set -euo pipefail
          anzahl=0
          shopt -s nullglob
          for f in migrations/negativfaelle/*.sql; do
            erwartet=$(sed -n 's/^-- erwartet: *//p' "$f" | head -1)
            if [ -z "$erwartet" ]; then
              echo "::error::$f nennt keine erwartete Bedingung (-- erwartet: <name>)"
              exit 1
            fi
            if psql -v ON_ERROR_STOP=1 -q -f "$f" >/tmp/aus.txt 2>&1; then
              echo "::error::$f ist DURCHGELAUFEN — die Bedingung fehlt"
              exit 1
            fi
            if ! grep -qF "$erwartet" /tmp/aus.txt; then
              echo "::error::$f scheitert an der falschen Bedingung. Erwartet: $erwartet"
              sed -n '1,5p' /tmp/aus.txt
              exit 1
            fi
            echo "  OK $(basename "$f") — abgewiesen durch $erwartet"
            anzahl=$((anzahl + 1))
          done
          if [ "$anzahl" -lt 4 ]; then
            echo "::error::nur $anzahl Negativfaelle gefunden, mindestens vier verlangt"
            exit 1
          fi

  # -------------------------------------------------------------------
  prueflauf:
    name: Tor 1c · Prueflauf gegen die blinden Prueffaelle
    runs-on: ubuntu-latest
    needs: [migration]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruefstand
          POSTGRES_DB: freiraum_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bestand herstellen — sonst misst der Prueflauf eine leere Datenbank
        run: |
          set -euo pipefail
          shopt -s nullglob
          psql -v ON_ERROR_STOP=1 -q -f schema/freiraum_datamodel.sql
          for m in migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$m"; done
          for s in seeds/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$s"; done

      # Die Klausel-Prueffaelle pruefen gegen einen LAUFENDEN Server. Ohne
      # .venv/bin/uvicorn kann der Prueflauf ihn nicht starten und meldet
      # GESPERRT -- ehrlich, aber gemessen ist dann nichts. Gemessen am
      # 10.08.2026: lokal 30 von 30, in CI waere derselbe Stand ungemessen
      # durchgelaufen, weil dieser Auftrag als einziger keine Abhaengigkeiten
      # installierte.
      - name: Anwendung bereitstellen — sonst misst Tor 1c die Anwendung nicht
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Prueflauf
        run: |
          set -euo pipefail
          if [ ! -x pruefungen/lauf.sh ]; then
            echo "::error::pruefungen/lauf.sh fehlt — Tor 1c GESPERRT (K23-M22)"
            exit 1
          fi
          mkdir -p nachweise/manifeste
          ./pruefungen/lauf.sh --bericht nachweise/manifeste/tor1_${{ github.run_id }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueflauf
          path: nachweise/manifeste/
          if-no-files-found: warn

  # -------------------------------------------------------------------
  sperre:
    name: Tor 1 · Sperre
    runs-on: ubuntu-latest
    needs: [lint, migration, prueflauf]
    if: always()
    steps:
      - name: Ergebnis feststellen
        run: |
          set -euo pipefail
          echo "lint=${{ needs.lint.result }}"
          echo "migration=${{ needs.migration.result }}"
          echo "prueflauf=${{ needs.prueflauf.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] \
          || [ "${{ needs.migration.result }}" != "success" ] \
          || [ "${{ needs.prueflauf.result }}" != "success" ]; then
            echo "::error::Tor 1 sperrt. Kein Bau erreicht Tor 2 (K23-D01)."
            exit 1
          fi
          echo "Tor 1 bestanden. Tor 2 bis 4 laufen ausserhalb dieser Datei."
