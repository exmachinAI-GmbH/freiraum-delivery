# der Regelsatz bleibt der von ruff 0.16.1 vorgegebene. Nachgemessen am
# 14.08.2026: 413 aktive Regeln ohne diese Datei, 413 mit ihr.
#
# Wer hier ein `select`, ein `ignore` oder ein `exclude` fuer das Repo
